# Reverse proxy перед сервісом інференсу — ЛР3, крок 8.

events {
    worker_connections 1024;
}

http {
    upstream api_backend {
        # TODO (крок 8): вкажіть адресу сервісу api з compose.yaml —
        # усередині мережі Docker Compose сервіси звертаються один до
        # одного за ІМЕНЕМ сервісу (не localhost!), на порт, який api
        # слухає всередині контейнера (крок 4: EXPOSE 8000).
        server api:8000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
        }
    }
}
